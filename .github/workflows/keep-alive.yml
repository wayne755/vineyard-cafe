name: Supabase Keep-Alive

# Supabase 무료 플랜은 7일 동안 API 요청이 없으면 프로젝트를 자동으로 일시정지시킵니다.
# 이 교회 카페 앱은 주일에만 쓰이기 때문에, 아무 조치가 없으면 정확히 그 7일 주기와
# 겹쳐서 예배 후 정작 필요할 때 DB가 멈춰있을 수 있습니다.
# 그래서 주 2회 가벼운 조회 요청을 보내 "활동 있음"으로 표시해 정지를 막습니다.
on:
  schedule:
    - cron: "0 6 * * 1,4" # 매주 월/목 06:00 UTC
  workflow_dispatch: {} # Actions 탭에서 수동 실행도 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl --fail --silent --show-error \
            "${SUPABASE_URL}/rest/v1/orders?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -o /dev/null
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
