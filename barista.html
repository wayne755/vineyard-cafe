<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Vineyard Cafe · Barista</title>
<style>
  :root {
    --cream: #f7f2e9;
    --cream-soft: #efe8d9;
    --brown: #3e2b22;
    --brown-soft: #6b564a;
    --sage: #7c8c6b;
    --sage-dark: #5f6e4f;
    --sage-light: #e4e9dc;
    --error: #b3452f;
    --white: #fffdf9;
    --radius: 16px;
    --shadow: 0 2px 10px rgba(62, 43, 34, 0.08);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--brown);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 18px 60px;
  }

  header.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  header.top .name {
    font-size: 20px;
    font-weight: 800;
  }

  /* 평소에는 숨겨두고, 연결이 끊겼을 때만 경고를 띄웁니다. */
  #conn-warning {
    background: #f6d9d0;
    color: var(--error);
    font-size: 13px;
    font-weight: 700;
    padding: 10px 14px;
    border-radius: 12px;
    margin-bottom: 16px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .waiting-pill {
    font-size: 14px;
    font-weight: 800;
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--sage-light);
    color: var(--sage-dark);
    white-space: nowrap;
  }

  .batch-card {
    background: var(--sage-light);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 24px;
  }

  .batch-card .title {
    font-size: 13px;
    font-weight: 700;
    color: var(--sage-dark);
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }

  .batch-card .content {
    font-size: 18px;
    font-weight: 700;
    color: var(--brown);
  }

  .batch-card .empty {
    font-size: 14px;
    font-weight: 500;
    color: var(--brown-soft);
  }

  .order-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .order-card {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 20px;
    border-left: 5px solid transparent;
  }

  /* 픽업 시간이 지난 주문 */
  .order-card.due { border-left-color: var(--error); }

  .order-card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
  }

  .order-no {
    font-size: 20px;
    font-weight: 800;
  }

  .order-customer {
    font-size: 14px;
    color: var(--brown-soft);
    margin-top: 2px;
  }

  .order-meta {
    text-align: right;
    font-size: 13px;
    color: var(--brown-soft);
  }

  .order-amount {
    font-size: 22px;
    font-weight: 800;
    color: var(--brown);
    line-height: 1.2;
    margin-bottom: 2px;
  }

  .order-meta .elapsed {
    font-weight: 700;
    color: var(--brown);
  }

  .order-meta .elapsed.overdue { color: var(--error); }

  .order-items {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 10px 0 14px;
  }

  .order-item-chip {
    background: var(--cream-soft);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 600;
  }

  .order-card-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .status-pill {
    font-size: 12px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--sage-light);
    color: var(--sage-dark);
  }

  .action-btn {
    flex: 0 0 auto;
    padding: 14px 22px;
    min-height: 48px;
    font-size: 15px;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    color: var(--white);
    background: var(--sage-dark);
    cursor: pointer;
  }

  .action-btn:active { opacity: 0.85; }

  .empty-state {
    text-align: center;
    color: var(--brown-soft);
    padding: 60px 20px;
    font-size: 15px;
  }

  #header-controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .sales-link {
    font-size: 14px;
    font-weight: 700;
    color: var(--sage-dark);
    text-decoration: none;
    padding: 10px 4px;
  }

  .sound-btn {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    line-height: 1;
    padding: 0;
    border-radius: 50%;
    border: 1px solid var(--cream-soft);
    background: var(--white);
    cursor: pointer;
  }

  .sound-btn.off { opacity: 0.45; }

  .done-section {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--cream-soft);
  }

  .done-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .done-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--brown-soft);
  }

  .clear-all-btn {
    font-size: 13px;
    font-weight: 700;
    padding: 8px 14px;
    min-height: 40px;
    border: none;
    border-radius: 10px;
    background: none;
    color: var(--brown-soft);
    text-decoration: underline;
    cursor: pointer;
  }

  .done-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    background: var(--white);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 14px;
    color: var(--brown-soft);
  }

  .done-item .done-actions {
    display: flex;
    gap: 8px;
    flex: 0 0 auto;
  }

  .dismiss-btn {
    padding: 10px 16px;
    min-height: 44px;
    font-size: 14px;
    font-weight: 700;
    border: 1px solid var(--cream-soft);
    border-radius: 10px;
    background: var(--white);
    color: var(--brown-soft);
    cursor: pointer;
  }

  .dismiss-btn:active { background: var(--cream-soft); }

  .undo-btn {
    flex: 0 0 auto;
    padding: 10px 18px;
    min-height: 44px;
    font-size: 14px;
    font-weight: 700;
    border: 1px solid var(--sage);
    border-radius: 10px;
    background: var(--white);
    color: var(--sage-dark);
    cursor: pointer;
  }

  .undo-btn:active { background: var(--sage-light); }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="header-left">
      <div class="name">Vineyard Cafe · Barista</div>
      <span class="waiting-pill" id="waiting-pill">대기 0</span>
    </div>
    <div id="header-controls">
      <a class="sales-link" href="sales.html">정산</a>
      <button type="button" class="sound-btn" id="sound-toggle">🔔</button>
    </div>
  </header>

  <div id="conn-warning" hidden>연결이 끊겼습니다 · 5초마다 새로고침 중</div>

  <div class="batch-card">
    <div class="title">묶어서 만들 음료 (대기 중)</div>
    <div class="content" id="batch-content"><span class="empty">대기 중인 주문이 없습니다</span></div>
  </div>

  <div class="order-list" id="order-list"></div>
  <div class="empty-state" id="empty-state" hidden>표시할 주문이 없습니다</div>

  <!-- 실수로 눌렀을 때 되돌리기 위한 최근 준비완료 목록 -->
  <div class="done-section" id="done-section" hidden>
    <div class="done-head">
      <div class="done-title">최근 준비완료</div>
      <button type="button" class="clear-all-btn" id="clear-all-btn">전체 지우기</button>
    </div>
    <div id="done-list"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="menu.js"></script>
<script>
  const DISMISSED_KEY = "baristaDismissedOrders";
  const TEMP_LABEL = { HOT: "Hot", ICE: "Ice" };
  const POLL_INTERVAL_MS = 5000;
  const TICK_INTERVAL_MS = 30000; // 경과 시간 라벨 갱신 주기

  const db = window.supabase.createClient(
    window.SUPABASE_CONFIG.url,
    window.SUPABASE_CONFIG.anonKey
  );

  // 메뉴 이름 -> 가격. 손님 화면과 같은 menu.js를 쓰므로 가격이 어긋날 일이 없습니다.
  const PRICE_BY_NAME = new Map(window.MENU.map((m) => [m.name, m.price]));

  // 주문에 저장된 가격을 우선 쓰고, 없으면(옛날 주문) 현재 메뉴 가격으로 계산합니다.
  function orderTotal(order) {
    return (order.items || []).reduce((sum, it) => {
      const price = typeof it.price === "number" ? it.price : PRICE_BY_NAME.get(it.name) || 0;
      return sum + price * it.qty;
    }, 0);
  }

  // 오늘 들어온 주문 전체(완료 포함). 완료된 건 메인 목록에서 빠지고 "최근 완료"에만 남습니다.
  let orders = [];
  let pollTimer = null;
  const knownIds = new Set(); // 알림음을 새 주문에만 울리기 위한 목록
  let initialLoaded = false;

  const byCreatedAt = (a, b) => new Date(a.created_at) - new Date(b.created_at);

  // 지난 주일에 완료 못 한 주문이 계속 쌓이지 않도록 오늘 것만 불러옵니다.
  function todayStartISO() {
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    return d.toISOString();
  }

  function isToday(iso) {
    return new Date(iso).toDateString() === new Date().toDateString();
  }

  // 처음 보는 주문이면 true (알림음 판단용)
  function noteOrder(row) {
    if (knownIds.has(row.id)) return false;
    knownIds.add(row.id);
    return true;
  }

  // "최근 준비완료"에서 지운 주문 id. DB 기록은 그대로 두고 이 태블릿 화면에서만 숨깁니다.
  // (anon 키에는 삭제 권한이 없고, 지우면 '오늘 합계' 정산도 틀어지기 때문)
  function loadDismissed() {
    try {
      return new Set(JSON.parse(localStorage.getItem(DISMISSED_KEY)) || []);
    } catch {
      return new Set();
    }
  }

  let dismissedIds = loadDismissed();

  function saveDismissed() {
    try {
      // 오늘 주문에 해당하는 id만 남겨서 목록이 계속 커지지 않게 정리
      const todayIds = new Set(orders.map((o) => o.id));
      dismissedIds = new Set([...dismissedIds].filter((id) => todayIds.has(id)));
      localStorage.setItem(DISMISSED_KEY, JSON.stringify([...dismissedIds]));
    } catch {
      // localStorage를 못 쓰는 환경이면 이번 세션 동안만 유지됨
    }
  }

  // ---- 데이터 가져오기 ----
  async function fetchOrders() {
    const { data, error } = await db
      .from("orders")
      .select("*")
      .gte("created_at", todayStartISO())
      .order("created_at", { ascending: true });

    if (error) {
      console.error(error);
      return;
    }

    // 폴링 중에 새로 들어온 주문에도 알림음이 울리도록
    const hasNew = data.filter((o) => noteOrder(o) && o.status === "waiting").length > 0;
    if (initialLoaded && hasNew) playChime();
    initialLoaded = true;

    orders = data;
    render();
  }

  // ---- 실시간 구독 ----
  function subscribeRealtime() {
    const channel = db
      .channel("barista-orders")
      .on(
        "postgres_changes",
        { event: "*", schema: "public", table: "orders" },
        handleRealtimeChange
      )
      .subscribe((status) => {
        if (status === "SUBSCRIBED") {
          setConnected(true);
          stopPolling();
        } else if (["TIMED_OUT", "CLOSED", "CHANNEL_ERROR"].includes(status)) {
          setConnected(false);
          startPolling();
        }
      });
    return channel;
  }

  function handleRealtimeChange(payload) {
    const { eventType, new: newRow, old: oldRow } = payload;

    if (eventType === "DELETE") {
      const idx = orders.findIndex((o) => o.id === oldRow.id);
      if (idx > -1) orders.splice(idx, 1);
      render();
      return;
    }

    if (!isToday(newRow.created_at)) return;

    const idx = orders.findIndex((o) => o.id === newRow.id);
    if (idx > -1) {
      orders[idx] = newRow;
    } else {
      orders.push(newRow);
      orders.sort(byCreatedAt);
    }

    if (eventType === "INSERT" && noteOrder(newRow)) playChime();

    render();
  }

  // ---- 새 주문 알림음 ----
  // 오디오 파일 없이 브라우저가 직접 소리를 만듭니다(오프라인에서도 동작).
  // 브라우저 정책상 화면을 한 번 터치하기 전까지는 소리가 나지 않습니다.
  let audioCtx = null;
  let soundOn = localStorage.getItem("baristaSound") !== "off";

  function unlockAudio() {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!audioCtx) audioCtx = new Ctx();
    if (audioCtx.state === "suspended") audioCtx.resume();
  }

  // ---- 태블릿 화면이 예배·운영 중에 꺼지지 않도록 ----
  // 브라우저가 지원할 때만 동작하며, 실패해도 앱 사용에는 지장이 없습니다.
  let wakeLock = null;

  async function keepScreenAwake() {
    if (!("wakeLock" in navigator) || wakeLock) return;
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => {
        wakeLock = null;
      });
    } catch {
      // 배터리 절약 모드 등으로 거부될 수 있습니다. 그럴 땐 태블릿 설정에서 자동 잠금을 꺼주세요.
    }
  }

  // 다른 앱에 갔다가 돌아오면 잠금이 풀려 있으므로 다시 요청합니다.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") keepScreenAwake();
  });

  function handleUserGesture() {
    unlockAudio();
    keepScreenAwake();
  }

  document.addEventListener("click", handleUserGesture);
  document.addEventListener("touchstart", handleUserGesture);

  function playChime() {
    if (!soundOn || !audioCtx) return;
    const start = audioCtx.currentTime;
    [880, 1174].forEach((freq, i) => {
      const at = start + i * 0.18;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, at);
      gain.gain.exponentialRampToValueAtTime(0.3, at + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.35);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(at);
      osc.stop(at + 0.4);
    });
  }

  const soundBtn = document.getElementById("sound-toggle");

  function renderSoundBtn() {
    soundBtn.textContent = soundOn ? "🔔" : "🔕";
    soundBtn.title = soundOn ? "새 주문 알림음 켜짐" : "새 주문 알림음 꺼짐";
    soundBtn.setAttribute("aria-label", soundBtn.title);
    soundBtn.classList.toggle("off", !soundOn);
  }

  soundBtn.addEventListener("click", () => {
    soundOn = !soundOn;
    localStorage.setItem("baristaSound", soundOn ? "on" : "off");
    renderSoundBtn();
    if (soundOn) playChime(); // 켤 때 소리를 들려줘서 볼륨을 확인할 수 있게
  });

  renderSoundBtn();

  // ---- 연결 끊김 폴백: 5초 폴링 ----
  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(fetchOrders, POLL_INTERVAL_MS);
  }

  function stopPolling() {
    if (!pollTimer) return;
    clearInterval(pollTimer);
    pollTimer = null;
  }

  function setConnected(isConnected) {
    document.getElementById("conn-warning").hidden = isConnected;
  }

  // ---- 상태 변경 ----
  async function advanceStatus(orderId, nextStatus) {
    const idx = orders.findIndex((o) => o.id === orderId);
    const prev = idx > -1 ? { ...orders[idx] } : null;

    // 되돌린 주문은 다시 준비완료가 됐을 때 숨겨져 있으면 안 되므로 해제
    if (nextStatus === "waiting" && dismissedIds.delete(orderId)) saveDismissed();

    // 낙관적 업데이트: 응답 기다리지 않고 화면 먼저 갱신
    if (idx > -1) {
      orders[idx] = { ...orders[idx], status: nextStatus };
      render();
    }

    const { error } = await db.from("orders").update({ status: nextStatus }).eq("id", orderId);
    if (error) {
      console.error(error);
      alert("상태 변경에 실패했어요. 다시 시도해 주세요.");
      if (prev) {
        // 실패 시 원래 상태로 되돌림
        const backIdx = orders.findIndex((o) => o.id === orderId);
        if (backIdx > -1) orders[backIdx] = prev;
        render();
      }
    }
  }

  // 픽업 시간("12:45")을 자정 기준 분으로. "예배 직후"처럼 시각이 아닌 옛 값은 -1(가장 먼저).
  function pickupMinutes(order) {
    const match = /^(\d{1,2}):(\d{2})$/.exec((order.pickup_time || "").trim());
    if (!match) return -1;
    return Number(match[1]) * 60 + Number(match[2]);
  }

  function nowMinutes() {
    const now = new Date();
    return now.getHours() * 60 + now.getMinutes();
  }

  function isPickupDue(order) {
    const mins = pickupMinutes(order);
    return mins < 0 || nowMinutes() >= mins;
  }

  // 빨리 나가야 하는 순서대로. 같은 시간대면 주문번호 순(먼저 주문한 사람 먼저).
  const byPickup = (a, b) => pickupMinutes(a) - pickupMinutes(b) || a.id - b.id;

  function minutesSinceOrder(order) {
    return Math.max(0, Math.floor((Date.now() - new Date(order.created_at).getTime()) / 60000));
  }

  // ---- 렌더링 ----
  // 미리 주문받는 방식이라 "주문한 지 몇 분"보다 "픽업 시간까지 몇 분"이 실제로 쓸모 있습니다.
  // 다만 이미 지난 시간대를 골라 주문했더라도(예: 13시에 12:30 선택) 방금 들어온 주문이
  // "30분 지남"으로 보이면 안 되므로, 지연 시간은 주문 접수 시각부터로 제한합니다.
  function pickupLabel(order) {
    const sinceOrder = minutesSinceOrder(order);
    const mins = pickupMinutes(order);

    if (mins >= 0) {
      const untilPickup = mins - nowMinutes();
      if (untilPickup > 0) return `${untilPickup}분 후`;
    }

    const late = mins < 0 ? sinceOrder : Math.min(sinceOrder, nowMinutes() - mins);
    return late < 1 ? "지금" : `${late}분 지남`;
  }

  function render() {
    // 상태는 대기중 / 준비완료 둘뿐입니다. (예전 'making' 데이터가 남아 있으면 대기중으로 취급)
    const waiting = orders.filter((o) => o.status !== "done");
    const done = orders.filter((o) => o.status === "done");

    document.getElementById("waiting-pill").textContent = `대기 ${waiting.length}`;

    renderBatch(waiting);
    renderList([...waiting].sort(byPickup));
    renderDone(done.filter((o) => !dismissedIds.has(o.id)));
  }

  function renderBatch(waitingOrders) {
    const totals = new Map(); // key: `${name}|${temp}` -> qty
    waitingOrders.forEach((o) => {
      (o.items || []).forEach((it) => {
        const key = `${it.name}|${it.temp}`;
        totals.set(key, (totals.get(key) || 0) + it.qty);
      });
    });

    const el = document.getElementById("batch-content");
    if (totals.size === 0) {
      el.innerHTML = `<span class="empty">대기 중인 주문이 없습니다</span>`;
      return;
    }

    const parts = [...totals.entries()]
      .sort((a, b) => b[1] - a[1])
      .map(([key, qty]) => {
        const [name, temp] = key.split("|");
        return `${name} ${TEMP_LABEL[temp] || temp} ${qty}`;
      });

    el.textContent = parts.join(" · ");
  }

  function renderList(activeOrders) {
    const listEl = document.getElementById("order-list");
    const emptyEl = document.getElementById("empty-state");

    if (activeOrders.length === 0) {
      listEl.innerHTML = "";
      emptyEl.hidden = false;
      return;
    }
    emptyEl.hidden = true;

    listEl.innerHTML = activeOrders
      .map((o) => {
        const itemsHtml = (o.items || [])
          .map((it) => `<span class="order-item-chip">${it.name} ${TEMP_LABEL[it.temp] || it.temp} x${it.qty}</span>`)
          .join("");

        const due = isPickupDue(o);

        return `
          <div class="order-card${due ? " due" : ""}">
            <div class="order-card-head">
              <div>
                <div class="order-no">#${o.id}</div>
                <div class="order-customer">${escapeHtml(o.customer_name)}</div>
              </div>
              <div class="order-meta">
                <div class="order-amount">$${orderTotal(o)}</div>
                <div>픽업 ${escapeHtml(o.pickup_time)}</div>
                <div class="elapsed${due ? " overdue" : ""}">${pickupLabel(o)}</div>
              </div>
            </div>
            <div class="order-items">${itemsHtml}</div>
            <div class="order-card-foot">
              <span class="status-pill waiting">대기중</span>
              <button class="action-btn" data-id="${o.id}">준비완료</button>
            </div>
          </div>
        `;
      })
      .join("");

    listEl.querySelectorAll(".action-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        advanceStatus(Number(btn.dataset.id), "done");
      });
    });
  }

  // 준비완료를 실수로 눌렀을 때 되돌릴 수 있도록 최근 5건을 남겨둡니다.
  function renderDone(doneOrders) {
    const section = document.getElementById("done-section");
    const listEl = document.getElementById("done-list");

    if (doneOrders.length === 0) {
      section.hidden = true;
      return;
    }

    const recent = [...doneOrders].sort((a, b) => byCreatedAt(b, a)).slice(0, 5);

    listEl.innerHTML = recent
      .map(
        (o) => `
          <div class="done-item">
            <span>#${o.id} ${escapeHtml(o.customer_name)} · $${orderTotal(o)}</span>
            <div class="done-actions">
              <button class="undo-btn" data-id="${o.id}">되돌리기</button>
              <button class="dismiss-btn" data-id="${o.id}">지우기</button>
            </div>
          </div>
        `
      )
      .join("");

    listEl.querySelectorAll(".undo-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        advanceStatus(Number(btn.dataset.id), "waiting");
      });
    });

    listEl.querySelectorAll(".dismiss-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        dismissedIds.add(Number(btn.dataset.id));
        saveDismissed();
        render();
      });
    });

    section.hidden = false;
  }

  document.getElementById("clear-all-btn").addEventListener("click", () => {
    orders.filter((o) => o.status === "done").forEach((o) => dismissedIds.add(o.id));
    saveDismissed();
    render();
  });

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str ?? "";
    return div.innerHTML;
  }

  // ---- 시작 ----
  keepScreenAwake();
  fetchOrders();
  subscribeRealtime();
  setInterval(render, TICK_INTERVAL_MS); // 경과 시간 라벨만 주기적으로 갱신
</script>
</body>
</html>
